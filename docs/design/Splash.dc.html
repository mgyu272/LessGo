<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#4F7F2B}a:hover{color:#3E6A20}
@keyframes flyin{0%{transform:translate(-300px,150px) rotate(-14deg) scale(.55);opacity:0}25%{opacity:1}100%{transform:none;opacity:1}}
@keyframes hover{0%,100%{transform:translateY(4px) rotate(-3deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.55}50%{transform:scaleX(.78);opacity:.3}}
@keyframes wind{from{transform:translateX(0)}to{transform:translateX(-520px)}}
@keyframes cloud{from{transform:translateX(0)}to{transform:translateX(-560px)}}
@keyframes draw{0%{stroke-dashoffset:700}70%,100%{stroke-dashoffset:0}}
@keyframes glow{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.35)}}
@keyframes sun{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes load{0%{width:4%}80%,100%{width:100%}}
@keyframes trail{0%{stroke-dashoffset:100;opacity:1}75%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes goal{0%,70%{transform:scale(1);opacity:.6}82%{transform:scale(1.6);opacity:1}100%{transform:scale(1);opacity:.6}}
.trail{stroke-dasharray:100;animation:trail 2.6s cubic-bezier(.45,0,.4,1) infinite}
.goal{transform-box:fill-box;transform-origin:center;animation:goal 2.6s ease-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.95}}
.star{animation:twinkle 3s ease-in-out infinite}
.s2{animation-delay:-1s}.s3{animation-delay:-2s}.s4{animation-delay:-.5s}
@keyframes fade{0%,100%{opacity:.6}50%{opacity:1}}
.flyin{transform-box:fill-box;transform-origin:center;animation:flyin 1.7s cubic-bezier(.2,.8,.25,1) both}
.hover{transform-box:fill-box;transform-origin:center;animation:hover 1.8s ease-in-out 1.7s infinite}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 1.8s ease-in-out 1.7s infinite}
.wind{animation:wind 1.4s linear infinite}
.w2{animation-delay:-.35s;animation-duration:1.2s}.w3{animation-delay:-.8s;animation-duration:1.6s}.w4{animation-delay:-1.1s}.w5{animation-delay:-.55s;animation-duration:1.3s}
.cloud{animation:cloud 16s linear infinite}
.c2{animation-delay:-6s;animation-duration:20s}.c3{animation-delay:-11s;animation-duration:13s}
.route{stroke-dasharray:700;animation:draw 3s ease-out infinite}
.halo{transform-box:fill-box;transform-origin:center;animation:glow 1.8s ease-in-out infinite}
.sun{transform-box:fill-box;transform-origin:center;animation:sun 4s ease-in-out infinite}
.bar{animation:load 3s ease-out infinite}
.msg{animation:fade 1.6s ease-in-out infinite}
.grain{position:absolute;inset:0;background:url(/_blob/49dbc8c740a1947f87e920d5227f968c) center top/414px auto repeat;opacity:.35;mix-blend-mode:luminosity;pointer-events:none}
@media (prefers-reduced-motion: reduce){.flyin,.hover,.shadow,.wind,.cloud,.route,.halo,.sun,.bar,.msg,.trail,.goal,.star{animation:none}.bar{width:60%}.runner{display:none}.wind{display:none}}
</style>
</helmet>
