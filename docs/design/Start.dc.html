<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시작 · 로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3F7F1C}a:hover{color:#2F6512}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-470px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.8);opacity:0}}
@keyframes sun{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.cloud{animation:drift 22s linear infinite}
.c2{animation-duration:30s;animation-delay:-12s}
.pin{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.sun{transform-box:fill-box;transform-origin:center;animation:sun 5s ease-in-out infinite}
.grain{position:absolute;inset:0;background:url(/_blob/49dbc8c740a1947f87e920d5227f968c) center top/414px auto repeat;opacity:.5;mix-blend-mode:luminosity;pointer-events:none}
.bh{position:relative;isolation:isolate;overflow:hidden}
.bh::before{content:"";position:absolute;inset:0;background:url(/_blob/bf38a862736ea3ce9378da6441abcaef) center/320px repeat;opacity:.35;mix-blend-mode:multiply;pointer-events:none;z-index:-1}
.field{transition:background .2s ease}
.field:focus-within{background:rgba(255,255,255,.35)}
.gbox{background:rgba(226,246,196,.6);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.7);box-shadow:0 14px 30px -16px rgba(150,215,80,.6)}
.gcta{background:rgba(190,236,130,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.6);box-shadow:0 14px 28px -12px rgba(150,215,80,.75),0 4px 10px -4px rgba(150,215,80,.5)}
.field input{outline:none}
.cta{transition:transform .15s ease,box-shadow .2s ease}
.cta:active{transform:scale(.98)}
.ghost{transition:background .2s ease}
.gwhite{background:rgba(246,252,234,.65);-webkit-backdrop-filter:none;backdrop-filter:none;border:0;box-shadow:inset 0 -3px 0 rgba(120,190,60,.22),inset 0 0 0 1px rgba(120,190,60,.14)}
.ghost:hover{background:rgba(246,252,234,.85)}
@media (prefers-reduced-motion: reduce){.cloud,.pin,.pulse,.sun,.runner{animation:none}.runner{display:none}}
.bh::before{display:none}
.glass{background:rgba(255,255,255,.58)!important;-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.8)!important;box-shadow:0 8px 24px -12px rgba(31,61,20,.35)!important}
.glass-g{background:rgba(95,165,42,.74)!important;-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid rgba(255,255,255,.35)}
.glass-d{background:rgba(255,255,255,.18)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.4)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E9F6D6; font-family: 'Noto Sans KR', sans-serif; color: #1F3D14">
  <div class="grain" aria-hidden="true"></div>

  <svg width="390" height="270" viewBox="0 0 390 270" aria-hidden="true" style="position: absolute; left: 0; top: 150px">
    <defs>
      <pattern id="lcren" x="0" y="0" width="11" height="8" patternUnits="userSpaceOnUse"><rect x="2" y="0" width="7" height="8" rx="1" fill="#FBF8EA"></rect></pattern>
    </defs>
    <circle cx="306" cy="66" r="46" fill="#FFF3C4" opacity=".55" class="sun"></circle>
    <circle cx="306" cy="66" r="24" fill="#FFEFB2"></circle>

    <g fill="#FFFFFF" opacity=".85">
      <g class="cloud"><ellipse cx="420" cy="40" rx="30" ry="9"></ellipse><ellipse cx="438" cy="34" rx="17" ry="10"></ellipse></g>
      <g class="cloud c2"><ellipse cx="300" cy="104" rx="24" ry="7"></ellipse><ellipse cx="314" cy="99" rx="13" ry="8"></ellipse></g>
    </g>

    <path d="M0 116 C 60 94, 120 90, 190 102 C 250 112, 300 90, 390 98 V270 H0 Z" fill="#DDF0C2"></path>
    <path d="M0 150 C 70 128, 140 124, 210 134 C 280 144, 330 130, 390 126 V270 H0 Z" fill="#C2E395"></path>
    <path d="M0 136 C 70 114, 140 110, 210 120 C 280 130, 330 116, 390 112 L390 127 C 330 131, 280 145, 210 135 C 140 125, 70 129, 0 151 Z" fill="#FBF8EA"></path>
    <path d="M0 129 C 70 107, 140 103, 210 113 C 280 123, 330 109, 390 105 L390 113 C 330 117, 280 131, 210 121 C 140 111, 70 115, 0 137 Z" fill="url(#lcren)"></path>
    <path d="M0 144 C 70 122, 140 118, 210 128 C 280 138, 330 124, 390 120" fill="none" stroke="#D9D4BC" stroke-width="1" stroke-dasharray="6 5"></path>

    <path d="M0 198 C 80 170, 150 166, 220 180 C 290 194, 340 174, 390 168 V270 H0 Z" fill="#9FD25E"></path>
    <g>
      <path d="M58 182 v12" stroke="#6E8F3C" stroke-width="2" stroke-linecap="round"></path><circle cx="58" cy="176" r="10" fill="#7DC140"></circle>
      <path d="M78 186 v9" stroke="#6E8F3C" stroke-width="2" stroke-linecap="round"></path><circle cx="78" cy="181" r="7" fill="#8FCB4E"></circle>
      <path d="M336 172 v12" stroke="#6E8F3C" stroke-width="2" stroke-linecap="round"></path><circle cx="336" cy="166" r="10" fill="#7DC140"></circle>
    </g>

    <path d="M0 246 C 90 226, 170 238, 250 234 C 320 230, 360 224, 390 228 V270 H0 Z" fill="#E9F6D6"></path>

    <path id="lroute" d="M26 246 C 90 224, 130 212, 170 198 C 210 184, 240 174, 262 150 C 276 134, 288 124, 300 118" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.1 8"></path>
    <g class="runner">
      <circle r="6" fill="#FFFFFF" opacity=".6"></circle>
      <circle r="3.5" fill="#FFFFFF" stroke="#5FA52A" stroke-width="2"></circle>
      <animateMotion dur="4.5s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1;1" keyTimes="0;.8;1" keySplines=".45 0 .45 1;0 0 1 1" path="M26 246 C 90 224, 130 212, 170 198 C 210 184, 240 174, 262 150 C 276 134, 288 124, 300 118"></animateMotion>
    </g>
    <circle class="pulse" cx="300" cy="118" r="8" fill="#7DC140"></circle>
    <g class="pin">
      <path d="M300 118 C 293 110 288 104 288 98 A 12 12 0 1 1 312 98 C 312 104 307 110 300 118 Z" fill="#5FA52A"></path>
      <circle cx="300" cy="98" r="4.5" fill="#FFFFFF"></circle>
    </g>
  </svg>

  <header style="position: absolute; left: 20px; right: 16px; top: 8px; height: 44px; display: flex; align-items: center; gap: 8px">
    <svg width="30" height="23" viewBox="20 0 672 512" role="img" aria-label="LessGo 로고">
      <path fill="#7DC140" stroke="#7DC140" stroke-width="24" stroke-linejoin="round" d="M36 44 L70 22 L98 10 L118 30 L150 46 L185 70 L215 100 L250 130 L275 165 L296 196 L330 206 L372 204 L404 214 L416 236 L440 226 L470 206 L488 186 L500 160 L520 120 L532 96 L540 80 L558 88 L572 116 L590 148 L606 188 L632 186 L664 182 L676 196 L672 222 L650 252 L620 270 L600 300 L566 304 L530 300 L500 312 L474 330 L456 362 L440 396 L418 428 L384 452 L356 470 L330 488 L318 500 L304 478 L276 462 L246 446 L232 424 L216 400 L190 384 L150 370 L110 350 L64 340 L46 324 L52 298 L84 284 L112 276 L104 236 L96 180 L84 128 L66 90 Z"></path>
    </svg>
    <span style="flex: 1; font: 800 17px 'Noto Sans KR', sans-serif; color: #2A4A17; letter-spacing: -.01em">LessGo</span>
    <button class="glass" aria-label="언어 바꾸기" style="height: 36px; min-width: 44px; padding: 0 12px; border-radius: 18px; border: 1px solid #D3E9B4; background: rgba(255,255,255,.75); color: #3F7F1C; font: 700 12px 'Noto Sans KR', sans-serif">KO</button>
  </header>

  <div style="position: absolute; left: 24px; right: 24px; top: 74px; display: flex; flex-direction: column; gap: 8px">
    <span style="font: 700 12px 'Noto Sans KR', sans-serif; color: #4C8A22; letter-spacing: .14em">RUN · SEONGBUK</span>
    <h1 style="margin: 0; font: 800 29px/1.32 'Noto Sans KR', sans-serif; color: #1F3D14; letter-spacing: -.02em">달리면서 만나는<br><span style="background: linear-gradient(transparent 60%, #CDEFA0 60%); padding: 0 2px">성북구</span> 이야기</h1>
  </div>


  <form style="position: absolute; left: 20px; right: 20px; top: 430px; margin: 0; display: flex; flex-direction: column; gap: 12px">
    <div class="gbox gwhite" style="border-radius: 20px; overflow: hidden">
      <div class="field" style="display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 64px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6FAE3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <label for="uid" style="font: 600 12px 'Noto Sans KR', sans-serif; color: #4F6B3B">아이디</label>
          <input id="uid" autocomplete="username" placeholder="아이디를 입력하세요" style="border: 0; background: transparent; padding: 0; font: 400 16px 'Noto Sans KR', sans-serif; color: #1F3D14">
        </div>
      </div>
      <div style="height: 1px; margin: 0 16px; background: rgba(95,165,42,.18)"></div>
      <div class="field" style="display: flex; align-items: center; gap: 12px; padding: 0 6px 0 16px; height: 64px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6FAE3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <label for="pw" style="font: 600 12px 'Noto Sans KR', sans-serif; color: #4F6B3B">비밀번호</label>
          <input id="pw" type="{{pwType}}" autocomplete="current-password" placeholder="비밀번호를 입력하세요" style="border: 0; background: transparent; padding: 0; font: 400 16px 'Noto Sans KR', sans-serif; color: #1F3D14">
        </div>
        <button type="button" aria-label="{{eyeLabel}}" aria-pressed="{{showPw}}" onClick="{{togglePw}}" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; background: transparent; color: #5C7A46; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <sc-if value="{{showPw}}" hint-placeholder-val="{{ false }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </sc-if>
          <sc-if value="{{hidePw}}" hint-placeholder-val="{{ true }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
          </sc-if>
        </button>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; font: 500 14px 'Noto Sans KR', sans-serif; color: #345A22; cursor: pointer">
        <input type="checkbox" checked="{{remember}}" onChange="{{toggleRemember}}" style="width: 18px; height: 18px; margin: 0; accent-color: #5FA52A">
        로그인 상태 유지
      </label>
      <a href="#" style="min-height: 44px; display: flex; align-items: center; font: 600 14px 'Noto Sans KR', sans-serif; color: #3F7F1C; text-decoration: none">아이디 · 비밀번호 찾기</a>
    </div>

    <a class="cta gcta" href="Main.dc.html" style="min-height: 56px; border-radius: 16px; color: #1C3A0C; display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 16px 'Noto Sans KR', sans-serif; text-decoration: none">
      로그인
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>

    <div style="display: flex; align-items: center; gap: 12px; margin: 2px 0" aria-hidden="true">
      <span style="flex: 1; height: 1px; background: #C6E59E"></span>
      <span style="font: 500 12px 'Noto Sans KR', sans-serif; color: #5C7A46">처음이신가요?</span>
      <span style="flex: 1; height: 1px; background: #C6E59E"></span>
    </div>

    <a class="ghost gbox gwhite" href="#" style="min-height: 52px; border-radius: 16px; color: #2F6512; display: flex; align-items: center; justify-content: center; font: 700 15px 'Noto Sans KR', sans-serif; text-decoration: none">새 계정 만들기</a>
  </form>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPw: false, remember: true };
  }
  renderVals() {
    const s = this.state;
    return {
      accent: this.props.accent ?? '#9AD35A',
      pwType: s.showPw ? 'text' : 'password',
      showPw: s.showPw,
      hidePw: !s.showPw,
      eyeLabel: s.showPw ? '비밀번호 숨기기' : '비밀번호 보기',
      togglePw: () => this.setState({ showPw: !s.showPw }),
      remember: s.remember,
      toggleRemember: () => this.setState({ remember: !s.remember })
    };
  }
}
</script>
</body>
</html>
