.glass{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.85);box-shadow:0 8px 24px -12px rgba(31,61,20,.35)}

.card{background:#FFFFFF;box-shadow:0 1px 0 rgba(120,190,60,.12),0 10px 24px -18px rgba(63,127,28,.5)}
.cta{background:rgba(190,236,130,.92);border:1px solid rgba(255,255,255,.6);box-shadow:0 14px 28px -12px rgba(150,215,80,.75),0 4px 10px -4px rgba(150,215,80,.5);color:#1C3A0C;transition:transform .15s ease}
.cta:active,.tap:active{transform:scale(.98)}
.tap{transition:transform .15s ease,background .2s ease;cursor:pointer;font-family:inherit}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font:700 11px 'Noto Sans KR',sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .3s ease both}
@media (prefers-reduced-motion: reduce){.rise{animation:none}}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-460px)}}
@keyframes dash{to{stroke-dashoffset:-28}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
.live{animation:live 1.2s ease-in-out infinite}
.bob{animation:bob 2.4s ease-in-out infinite}
.cloud{animation:drift 26s linear infinite}.c2{animation-duration:34s;animation-delay:-14s}
.walk{animation:dash 1.2s linear infinite}
.is-paused .ping,.is-paused .live,.is-paused .bob,.is-paused .cloud,.is-paused .walk{animation-play-state:paused}
.seg-on{background:#FFFFFF;color:#1F3D14;box-shadow:0 4px 12px -4px rgba(31,61,20,.3)}
.seg-off{background:transparent;color:#3F5A2C}
.scrim{position:absolute;inset:0;background:rgba(31,61,20,.35);z-index:5}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12px 'Noto Sans KR',sans-serif;color:#3F5A2C}
@media (prefers-reduced-motion: reduce){.ping,.live,.bob,.cloud,.walk{animation:none}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paused: false, voice: true, confirm: false, view: 'scene' };
  }
  renderVals() {
    const s = this.state;
    return {
      scene: s.view === 'scene', isMap: s.view === 'map',
      sceneCls: s.view === 'scene' ? 'seg-on' : 'seg-off', mapCls: s.view === 'map' ? 'seg-on' : 'seg-off',
      toScene: () => this.setState({ view: 'scene' }), toMap: () => this.setState({ view: 'map' }),
      paused: s.paused, running: !s.paused,
      rootCls: s.paused ? 'is-paused' : '',
      pauseLabel: s.paused ? '다시 시작' : '일시정지',
      statusText: s.paused ? '일시정지 중' : '의릉 코스 · 0:56',
      liveColor: s.paused ? '#C9A227' : '#5FA52A',
      togglePause: () => this.setState({ paused: !s.paused }),
      voiceOn: s.voice, voiceOff: !s.voice,
      voiceLabel: s.voice ? '음성 켜짐' : '음성 꺼짐',
      toggleVoice: () => this.setState({ voice: !s.voice }),
      confirm: s.confirm,
      askStop: () => this.setState({ confirm: true }),
      closeStop: () => this.setState({ confirm: false })
    };
  }
}
</script>
