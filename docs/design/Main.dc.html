@keyframes pick{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pin{animation:bob 2.8s ease-in-out infinite}
.pin2{animation-delay:.5s}.pin3{animation-delay:1s}.pin4{animation-delay:1.5s}
.dot{animation:ping 2s ease-out infinite;border-radius:50%}
.km{transition:background .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease}
.km-on{animation:pick .35s ease}
.grab{touch-action:none;cursor:grab}
.grab:active{cursor:grabbing}
.more{animation:rise .4s ease both}
.bh{position:relative;isolation:isolate;overflow:hidden}
.bh::before{content:"";position:absolute;inset:0;background:url(/_blob/bf38a862736ea3ce9378da6441abcaef) center/320px repeat;opacity:.42;mix-blend-mode:multiply;pointer-events:none;z-index:-1}
.hanji{isolation:isolate}
.hanji::before{content:"";position:absolute;inset:0;border-radius:inherit;background:url(/_blob/49dbc8c740a1947f87e920d5227f968c) center top/414px auto repeat;opacity:.3;mix-blend-mode:luminosity;pointer-events:none;z-index:0}
.hanji>*{position:relative;z-index:1}
@media (prefers-reduced-motion: reduce){.pin,.dot,.km-on,.more{animation:none}}
.bh::before{display:none}
.chips{scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.chips::-webkit-scrollbar{display:none}
.seg{transition:background .25s ease,color .25s ease,box-shadow .25s ease}
.fab{transition:top .42s cubic-bezier(.22,1.2,.36,1),opacity .2s ease}
.glass{background:rgba(255,255,255,.58)!important;-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.8)!important;box-shadow:0 8px 24px -12px rgba(31,61,20,.35)!important}

.glass-d{background:rgba(255,255,255,.18)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.4)!important}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { top: 420, dragging: false, km: 5 };
    this.snaps = [150, 420, 640];
    this.drag = null;
    this.onDown = (e) => {
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
      this.drag = { y: e.clientY, top: this.state.top, moved: 0 };
      this.setState({ dragging: true });
    };
    this.onMove = (e) => {
      if (!this.drag) return;
      const dy = e.clientY - this.drag.y;
      this.drag.moved = Math.max(this.drag.moved, Math.abs(dy));
      const min = this.snaps[0], max = this.snaps[this.snaps.length - 1];
      this.setState({ top: Math.min(max + 30, Math.max(min - 30, this.drag.top + dy)) });
    };
    this.onUp = () => {
      if (!this.drag) return;
      const d = this.drag; this.drag = null;
      let next;
      if (d.moved < 6) {
        const i = this.snaps.indexOf(d.top);
        next = i > 0 ? this.snaps[0] : this.snaps[1];
      } else {
        next = this.snaps.reduce((a, b) => Math.abs(b - this.state.top) < Math.abs(a - this.state.top) ? b : a);
      }
      this.setState({ top: next, dragging: false });
    };
    this.onKey = (e) => {
      if (e.key === 'ArrowUp') { e.preventDefault(); const i = this.snaps.indexOf(this.state.top); this.setState({ top: this.snaps[Math.max(0, i - 1)] }); }
      if (e.key === 'ArrowDown') { e.preventDefault(); const i = this.snaps.indexOf(this.state.top); this.setState({ top: this.snaps[Math.min(this.snaps.length - 1, i + 1)] }); }
    };
  }
  renderVals() {
    const s = this.state;
    return {
      top: s.top,
      ease: s.dragging ? 'none' : 'top .42s cubic-bezier(.22,1.2,.36,1)',
      expanded: s.top === this.snaps[0],
      label: s.top === this.snaps[0] ? '시트 내리기' : '시트 올리기',
      onDown: this.onDown, onMove: this.onMove, onUp: this.onUp, onKey: this.onKey,
      km3Style: this.state.km === 3 ? 'background: #FFFFFF; color: #1F3D14; box-shadow: 0 4px 12px -4px rgba(31,61,20,.3);' : 'background: transparent; color: #4F6B3B; box-shadow: none;',
      km3Sub: this.state.km === 3 ? '#3F7F1C' : '#4F6B3B',
      km3On: this.state.km === 3 ? 'true' : 'false',
      km3Cls: this.state.km === 3 ? 'km-on' : '',
      pick3: () => this.setState({ km: 3 }),
      km5Style: this.state.km === 5 ? 'background: #FFFFFF; color: #1F3D14; box-shadow: 0 4px 12px -4px rgba(31,61,20,.3);' : 'background: transparent; color: #4F6B3B; box-shadow: none;',
      km5Sub: this.state.km === 5 ? '#3F7F1C' : '#4F6B3B',
      km5On: this.state.km === 5 ? 'true' : 'false',
      km5Cls: this.state.km === 5 ? 'km-on' : '',
      pick5: () => this.setState({ km: 5 }),
      km8Style: this.state.km === 10 ? 'background: #FFFFFF; color: #1F3D14; box-shadow: 0 4px 12px -4px rgba(31,61,20,.3);' : 'background: transparent; color: #4F6B3B; box-shadow: none;',
      km8Sub: this.state.km === 10 ? '#3F7F1C' : '#4F6B3B',
      km8On: this.state.km === 10 ? 'true' : 'false',
      km8Cls: this.state.km === 10 ? 'km-on' : '',
      pick8: () => this.setState({ km: 10 }),
      kmLabel: this.state.km,
      kmMin: Math.round(this.state.km * 6.5),
      fabTop: s.top - 62,
      fabOp: s.top === this.snaps[0] ? 0 : 1,
      fabVis: s.top === this.snaps[0] ? 'hidden' : 'visible'
    };
  }
}
</script>
