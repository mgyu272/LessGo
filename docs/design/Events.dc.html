<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>성북 문화 활동</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3F7F1C}a:hover{color:#2F6512}
.bg-grain{position:absolute;inset:0;background:url(/_blob/49dbc8c740a1947f87e920d5227f968c) center top/414px auto repeat;opacity:.35;mix-blend-mode:luminosity;pointer-events:none;z-index:0}
.paper{position:relative;isolation:isolate}
.paper::before{content:"";position:absolute;inset:0;border-radius:inherit;background:url(/_blob/49dbc8c740a1947f87e920d5227f968c) center top/414px auto repeat;opacity:.3;mix-blend-mode:luminosity;pointer-events:none;z-index:0}
.paper>*{position:relative;z-index:1}
.glass{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.85);box-shadow:0 8px 24px -12px rgba(31,61,20,.35)}
.soft{background:rgba(246,252,234,.7);box-shadow:inset 0 -3px 0 rgba(120,190,60,.22),inset 0 0 0 1px rgba(120,190,60,.14)}
.card{background:#FFFFFF;box-shadow:0 1px 0 rgba(120,190,60,.12),0 10px 24px -18px rgba(63,127,28,.5)}
.cta{background:rgba(190,236,130,.92);border:1px solid rgba(255,255,255,.6);box-shadow:0 14px 28px -12px rgba(150,215,80,.75),0 4px 10px -4px rgba(150,215,80,.5);color:#1C3A0C;transition:transform .15s ease}
.cta:active,.tap:active{transform:scale(.98)}
.tap{transition:transform .15s ease,background .2s ease;cursor:pointer;font-family:inherit}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font:700 11px 'Noto Sans KR',sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .3s ease both}
@media (prefers-reduced-motion: reduce){.rise{animation:none}}
.day{width:100%;height:70px;border:0;border-radius:16px;transition:background .2s ease,color .2s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:inherit}
.scrim{position:absolute;inset:0;background:rgba(31,61,20,.38);z-index:5}
.kv{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-top:1px solid #EAF3DD;font:400 14px 'Noto Sans KR',sans-serif}
.kv:first-child{border-top:0}.kv dt{color:#4F6B3B;font-weight:600}.kv dd{margin:0;color:#1F3D14}
</style>
</helmet>
<div style="width: 390px; height: 980px; position: relative; overflow: hidden; background: #E9F6D6; font-family: 'Noto Sans KR', sans-serif; color: #1F3D14">
  <div class="bg-grain" aria-hidden="true"></div>
  <div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; padding: 12px 18px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 8px; height: 48px">
      <a class="glass" href="Places.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #1F3D14; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 style="flex: 1; margin: 0; font: 800 22px 'Noto Sans KR', sans-serif; letter-spacing: -.02em">성북 문화 활동</h1>
      <button class="glass tap" aria-label="달력으로 보기" style="width: 44px; height: 44px; border-radius: 22px; color: #2F6512; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></button>
    </div>
    <p style="margin: -6px 2px 0; font: 400 13px 'Noto Sans KR', sans-serif; color: #4F6B3B">달리기 코스 근처의 해설 투어, 전시, 축제를 모았어요</p>

    <section class="card" aria-label="이번 주 날짜" style="border-radius: 22px; padding: 12px 10px 10px">
      <div style="display: flex; align-items: center; gap: 4px; padding: 0 6px 8px">
        <b style="flex: 1; font: 800 15px 'Noto Sans KR', sans-serif">{{weekTitle}}</b>
        <button class="tap" aria-label="지난주" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: #F2F9E6; color: #2F6512; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <button class="tap" aria-label="다음 주" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: #F2F9E6; color: #2F6512; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      </div>
      <div role="radiogroup" aria-label="날짜" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button class="day tap" role="radio" aria-checked="{{d.on}}" aria-label="{{d.aria}}" onClick="{{d.pick}}" style="{{d.style}}">
            <small style="font: 600 11px 'Noto Sans KR', sans-serif; color: {{d.wColor}}">{{d.w}}</small>
            <b style="font: 800 17px/1.1 'Noto Sans KR', sans-serif">{{d.n}}</b>
            <span aria-hidden="true" style="display: flex; gap: 2px; height: 5px">
              <i style="width: 5px; height: 5px; border-radius: 3px; background: {{d.dot1}}"></i><i style="width: 5px; height: 5px; border-radius: 3px; background: {{d.dot2}}"></i>
            </span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 6px 0; font: 500 11px 'Noto Sans KR', sans-serif; color: #4F6B3B">
        <span style="display: flex; align-items: center; gap: 4px"><i style="width: 6px; height: 6px; border-radius: 3px; background: #5FA52A"></i>활동 있는 날</span>
        <span style="display: flex; align-items: center; gap: 4px"><i style="width: 14px; height: 14px; border-radius: 5px; box-shadow: inset 0 0 0 1.5px #9FD25E"></i>오늘</span>
      </div>
    </section>

    <div class="scroll" role="radiogroup" aria-label="주제" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -18px; padding: 0 18px 4px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <button class="tap" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="flex: none; height: 38px; padding: 0 14px; border: 0; border-radius: 19px; {{c.style}} font: 600 14px 'Noto Sans KR', sans-serif">{{c.label}}</button>
      </sc-for>
    </div>

    <p style="margin: 0 2px -4px; font: 600 13px 'Noto Sans KR', sans-serif; color: #4F6B3B">{{countText}}</p>
    <sc-for list="{{events}}" as="e" hint-placeholder-count="3">
      <button class="card tap" onClick="{{e.open}}" style="border: 0; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; text-align: left; color: #1F3D14">
        <span style="display: flex; gap: 6px; flex-wrap: wrap"><span class="badge" style="background: #EAF7D8; color: #2F6512">{{e.tag}}</span><span class="badge" style="background: #F6F4EC; color: #6B5A2A">{{e.fee}}</span><span class="badge" style="background: #FFFFFF; color: #3F7F1C; box-shadow: inset 0 0 0 1px #DCEDC6"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>{{e.near}}</span></span>
        <b style="font: 800 17px/1.35 'Noto Sans KR', sans-serif">{{e.title}}</b>
        <span style="display: flex; align-items: center; gap: 12px; font: 500 13px 'Noto Sans KR', sans-serif; color: #4F6B3B"><span style="display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{e.when}}</span><span style="display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>{{e.where}}</span></span>
      </button>
    </sc-for>
    <p style="margin: 4px 4px 0; display: flex; gap: 6px; font: 400 12px/1.5 'Noto Sans KR', sans-serif; color: #4F6B3B"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg><span>일정은 각 기관 공식 안내를 기준으로 하루 한 번 갱신돼요. 참여 전 공식 페이지에서 꼭 확인하세요.</span></p>
  </div>

  <sc-if value="{{hasSel}}" hint-placeholder-val="{{ false }}">
    <div class="scrim" onClick="{{close}}"></div>
    <section class="paper rise" role="dialog" aria-label="문화 활동 상세" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; border-radius: 28px 28px 0 0; background: #FBFBF4; padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 14px">
      <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #C6E59E"></span>
      <div style="display: flex; gap: 8px; align-items: flex-start">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span class="badge" style="align-self: flex-start; background: #EAF7D8; color: #2F6512">{{sel.tag}}</span><h2 style="margin: 0; font: 800 20px/1.35 'Noto Sans KR', sans-serif">{{sel.title}}</h2></div>
        <button class="tap" aria-label="닫기" onClick="{{close}}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #3F5A2C; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <dl class="card" style="margin: 0; border-radius: 18px; padding: 2px 16px">
        <div class="kv"><dt>일시</dt><dd>{{sel.when}}</dd></div>
        <div class="kv"><dt>장소</dt><dd>{{sel.where}}</dd></div>
        <div class="kv"><dt>요금</dt><dd>{{sel.fee}}</dd></div>
        <div class="kv"><dt>신청</dt><dd>[신청 방법] · [정원]</dd></div>
      </dl>
      <small style="display: flex; gap: 6px; font: 400 12px/1.5 'Noto Sans KR', sans-serif; color: #4F6B3B"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15 9.5a3.5 3.5 0 1 0 0 5"></path></svg>출처 [주최 기관] 공식 안내 · 마지막 확인 [YYYY.MM.DD]</small>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
        <a class="soft" href="#" style="height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; font: 700 15px 'Noto Sans KR', sans-serif; color: #2F6512; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>공식 페이지</a>
        <a class="cta" href="CourseSetup.dc.html" style="height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; font: 800 15px 'Noto Sans KR', sans-serif; text-decoration: none">달려서 가기<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 2, cat: 'all', sel: -1 }; }
  renderVals() {
    const s = this.state;
    const ON = 'background: #2F6512; color: #FFFFFF;';
    const OFF = 'background: rgba(246,252,234,.7); color: #1F3D14; box-shadow: inset 0 -3px 0 rgba(120,190,60,.22), inset 0 0 0 1px rgba(120,190,60,.14);';
    const W = ['월', '화', '수', '목', '금', '토', '일'];
    const cnt = [1, 0, 2, 1, 0, 2, 1];
    const C = [['all', '전체'], ['tour', '해설 투어'], ['show', '전시'], ['stage', '공연'], ['fest', '축제'], ['class', '체험']];
    const E = [
      { cat: 'tour', tag: '해설 투어', title: '(예시) 만해의 길 해설 산책', when: '[시간]', where: '심우장 일대', near: '심우장', fee: '무료' },
      { cat: 'show', tag: '전시', title: '(예시) 왕릉의 석물 사진전', when: '[기간]', where: '[전시 장소]', near: '의릉', fee: '무료' },
      { cat: 'class', tag: '체험', title: '(예시) 숲속 왕릉 아침 걷기', when: '[시간]', where: '정릉 입구', near: '정릉', fee: '[요금]' }
    ];
    const list = E.map((e, i) => ({ ...e, i })).filter((e) => s.cat === 'all' || e.cat === s.cat);
    const sel = E[s.sel] || E[0];
    return {
      weekTitle: '2026년 11월 · 첫째 주',
      days: W.map((w, i) => { const on = s.day === i, today = i === 2, n = cnt[i]; return { w, n: 2 + i, aria: '11월 ' + (2 + i) + '일 ' + w + '요일' + (n ? ', 활동 ' + n + '개' : ''), on: on ? 'true' : 'false', wColor: on ? '#DDF3C4' : (i === 6 ? '#B4532A' : (i === 5 ? '#3F6FB0' : '#6B8259')), dot1: n > 0 ? (on ? '#CDEFA0' : '#5FA52A') : 'transparent', dot2: n > 1 ? (on ? '#CDEFA0' : '#9FD25E') : 'transparent', style: on ? 'background: #2F6512; color: #FFFFFF; box-shadow: 0 10px 18px -10px rgba(31,61,20,.7);' : (today ? 'background: #F2F9E6; color: #1F3D14; box-shadow: inset 0 0 0 1.5px #9FD25E;' : 'background: transparent; color: #1F3D14;'), pick: () => this.setState({ day: i }) }; }),
      cats: C.map(([k, label]) => ({ label, on: s.cat === k ? 'true' : 'false', style: s.cat === k ? ON : OFF, pick: () => this.setState({ cat: k }) })),
      events: list.map((e) => ({ ...e, open: () => this.setState({ sel: e.i }) })),
      countText: list.length ? '문화 활동 ' + list.length + '개' : '이 날짜에는 해당 활동이 없어요',
      hasSel: s.sel >= 0, sel, close: () => this.setState({ sel: -1 })
    };
  }
}
</script>
</body>
</html>
