<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 아이폰 노치·홈 바 영역까지 화면을 채우고, 여백은 CSS safe-area로 맞춰요 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF6E3" />
    <!-- 아이폰 "홈 화면에 추가"로 열면 주소창 없이 앱처럼 보여요 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RunTrip" />
    <title>Seongbuk RunTrip</title>
    <!-- 글꼴 미리 받기: CSS를 읽기 전에 바로 받기 시작해서 첫 화면부터 최종 글씨체로 (styles.css @font-face와 같은 파일) -->
    <link rel="preload" href="/fonts/PretendardVariable-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/EF_cucumbersalad-subset.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
